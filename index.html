<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sorry Azi</title>

  <!-- Cartoon Font -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      font-family:'Fredoka', sans-serif;

      background:
        radial-gradient(circle at top left, #ffd6ea 0%, transparent 30%),
        radial-gradient(circle at bottom right, #ffc2df 0%, transparent 35%),
        linear-gradient(135deg, #ffe5f1, #ffd8eb);

      animation:bgMove 8s ease-in-out infinite alternate;
    }

    @keyframes bgMove{
      from{
        background-position:0% 0%, 100% 100%, center;
      }
      to{
        background-position:10% 5%, 90% 95%, center;
      }
    }

    .card{
      width:min(90%, 750px);
      padding:50px 40px;
      border-radius:35px;

      background:rgba(255,255,255,0.35);
      backdrop-filter:blur(12px);

      border:2px solid rgba(255,255,255,0.5);

      box-shadow:
        0 10px 40px rgba(255, 131, 180, 0.25),
        inset 0 0 20px rgba(255,255,255,0.3);

      text-align:center;

      animation:float 4s ease-in-out infinite;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(-8px);
      }
    }

    h1{
      font-size:clamp(2.4rem, 5vw, 4.5rem);
      color:#ff5f9e;

      text-shadow:
        0 3px 10px rgba(255,95,158,0.25);

      margin-bottom:25px;
      letter-spacing:1px;
    }

    p{
      font-size:clamp(1rem, 2vw, 1.45rem);
      color:#7b4860;
      line-height:1.9;
      font-weight:500;
    }

    .heart{
      position:absolute;
      font-size:22px;
      opacity:0.25;
      animation:floatHearts linear infinite;
      user-select:none;
    }

    @keyframes floatHearts{
      from{
        transform:translateY(100vh) rotate(0deg);
      }
      to{
        transform:translateY(-120px) rotate(360deg);
      }
    }

    .heart:nth-child(1){ left:10%; animation-duration:12s; }
    .heart:nth-child(2){ left:25%; animation-duration:16s; }
    .heart:nth-child(3){ left:50%; animation-duration:13s; }
    .heart:nth-child(4){ left:70%; animation-duration:18s; }
    .heart:nth-child(5){ left:88%; animation-duration:14s; }

  </style>
</head>
<body>

  <div class="heart">♡</div>
  <div class="heart">♡</div>
  <div class="heart">♡</div>
  <div class="heart">♡</div>
  <div class="heart">♡</div>

  <div class="card">
    <h1>i’m sorry azi :(</h1>

    <p>
      i never meant to even hurt you any way im very sorry.<br><br>

      i was only joking around and i didn’t
      think it would hurt you like that.<br><br>

      i’m truly sorry and i hope you can forgive me. 
          - ahmad 
         ✌️✌️🥺
    </p>
  </div>

</body>
</html>
